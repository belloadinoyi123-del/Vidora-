<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Vidora</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f0f12;
      color: white;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #15151b;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #292932;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      color: #ffffff;
    }

    .logo span {
      color: #ff2d75;
    }

    .header-icons {
      display: flex;
      gap: 15px;
      font-size: 22px;
    }

    .stories {
      display: flex;
      gap: 15px;
      padding: 15px;
      overflow-x: auto;
      background: #15151b;
    }

    .story {
      text-align: center;
      font-size: 12px;
      min-width: 65px;
    }

    .story-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 3px solid #ff2d75;
      margin-bottom: 5px;
      background: linear-gradient(135deg, #333, #777);
    }

    .feed {
      max-width: 600px;
      margin: auto;
      padding-bottom: 90px;
    }

    .post {
      margin: 15px;
      background: #19191f;
      border-radius: 15px;
      overflow: hidden;
      border: 1px solid #292932;
    }

    .post-header {
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff2d75, #6b4eff);
    }

    .username {
      font-weight: bold;
    }

    .post-video {
      height: 350px;
      background: linear-gradient(135deg, #28283a, #111);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
    }

    .post-actions {
      padding: 15px;
      display: flex;
      gap: 22px;
      font-size: 23px;
    }

    .post-text {
      padding: 0 15px 18px;
      color: #ddd;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #18181e;
      display: flex;
      justify-content: space-around;
      padding: 14px 5px;
      border-top: 1px solid #292932;
    }

    .nav-item {
      text-align: center;
      font-size: 11px;
      cursor: pointer;
    }

    .nav-icon {
      font-size: 24px;
      display: block;
      margin-bottom: 3px;
    }

    .create-btn {
      background: #ff2d75;
      width: 45px;
      height: 38px;
      border-radius: 10px;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .section {
      display: none;
      padding: 25px 15px 100px;
      max-width: 600px;
      margin: auto;
    }

    .section.active {
      display: block;
    }

    .home.active {
      display: block;
    }

    .home {
      display: block;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      background: #ff2d75;
      color: white;

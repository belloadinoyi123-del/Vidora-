<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vidora</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#101014;
  color:white;
  padding-bottom:80px;
}

header{
  background:#18181f;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
}

.logo{
  font-size:28px;
  font-weight:bold;
}

.logo span{
  color:#ff2d75;
}

.icons{
  font-size:24px;
}

.stories{
  display:flex;
  gap:15px;
  overflow:auto;
  padding:15px;
}

.story{
  text-align:center;
  font-size:12px;
}

.circle{
  width:58px;
  height:58px;
  border-radius:50%;
  background:#444;
  border:3px solid #ff2d75;
  margin-bottom:5px;
}

.feed{
  max-width:600px;
  margin:auto;
}

.post{
  margin:15px;
  background:#1b1b22;
  border-radius:15px;
  overflow:hidden;
}

.user{
  padding:15px;
  display:flex;
  gap:10px;
  align-items:center;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:linear-gradient(45deg,#ff2d75,#6b4eff);
}

.video{
  height:330px;
  background:#292936;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
}

.actions{
  padding:15px;
  font-size:24px;
  display:flex;
  gap:20px;
}

.caption{
  padding:0 15px 20px;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#18181f;
  display:flex;
  justify-content:space-around;
  padding:15px 5px;
}

.nav{
  text-align:center;
  font-size:12px;
}

.nav span{
  display:block;
  font-size:22px;
}

</style>
</head>

<body>

<header>
  <div class="logo">Vi<span>dora</span></div>
  <div class="icons">💬 🔔</div>
</header>

<div class="stories">
  <div class="story"><div class="circle"></div>Your Story</div>
  <div class="story"><div class="circle"></div>James</div>
  <div class="story"><div class="circle"></div>Sarah</div>
  <div class="story"><div class="circle"></div>Daniel</div>
</div>

<div class="feed">

  <div class="post">
    <div class="user">
      <div class="avatar"></div>
      <div>
        <b>@vidora_creator</b><br>
        <small>Just now</small>
      </div>
    </div>

    <div class="video">▶</div>

    <div class="actions">♡ 💬 ↗</div>

    <div class="caption">
      Welcome to <b>Vidora!</b> 🚀<br>
      Share videos and connect with people.
    </div>
  </div>

  <div class="post">
    <div class="user">
      <div class="avatar"></div>
      <div>
        <b>@explore</b><br>
        <small>Trending now</small>
      </div>
    </div>

    <div class="video">🎬</div>

    <div class="actions">♡ 💬 ↗</div>

    <div class="caption">
      Discover amazing content on Vidora.
    </div>
  </div>

</div>

<nav>
  <div class="nav"><span>🏠</span>Home</div>
  <div class="nav"><span>🔍</span>Discover</div>
  <div class="nav"><span>➕</span>Create</div>
  <div class="nav"><span>💬</span>Chat</div>
  <div class="nav"><span>👤</span>Profile</div>
</nav>

</body>
</html>

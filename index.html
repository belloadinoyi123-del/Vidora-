<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidora</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<!-- ================= AUTH ================= -->

<section id="authScreen">

  <div class="authBox">

    <div class="brand">
      Vi<span>dora</span>
    </div>

    <p class="tagline">Watch. Create. Connect.</p>

    <input
      id="email"
      type="email"
      placeholder="Email address"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button id="signUpBtn">
      Create Account
    </button>

    <button id="loginBtn" class="secondary">
      Log In
    </button>

    <p id="authMessage"></p>

  </div>

</section>


<!-- ================= MAIN APP ================= -->

<section id="app" class="hidden">

  <!-- HEADER -->

  <header>

    <div class="logo">
      Vi<span>dora</span>
    </div>

    <div class="headerButtons">
      <button id="searchBtn">🔍</button>
      <button id="notificationBtn">🔔</button>
    </div>

  </header>


  <!-- ================= HOME ================= -->

  <main id="homePage">

    <!-- STORIES -->

    <div class="stories">

      <div class="story">
        <div class="storyCircle">+</div>
        <small>Your Story</small>
      </div>

      <div class="story">
        <div class="storyCircle"></div>
        <small>James</small>
      </div>

      <div class="story">
        <div class="storyCircle"></div>
        <small>Sarah</small>
      </div>

      <div class="story">
        <div class="storyCircle"></div>
        <small>Daniel</small>
      </div>

    </div>


    <!-- CREATE POST -->

    <section class="createCard">

      <h2>Create Post</h2>

      <textarea
        id="caption"
        placeholder="What's happening?"
      ></textarea>

      <input
        id="mediaFile"
        type="file"
        accept="image/*,video/*"
      >

      <button id="publishBtn">
        📤 Publish
      </button>

      <p id="uploadMessage"></p>

    </section>


    <!-- FEED -->

    <section id="feed">

      <div class="loading">
        Loading Vidora...
      </div>

    </section>

  </main>


  <!-- ================= PROFILE ================= -->

  <main id="profilePage" class="hidden">

    <section class="profileCard">

      <div id="profileAvatar" class="profileAvatar">
        V
      </div>

      <h2 id="profileUsername">
        User
      </h2>

      <p id="profileEmail"></p>

      <button id="logoutBtn">
        Log Out
      </button>

    </section>

  </main>


  <!-- ================= DISCOVER ================= -->

  <main id="discoverPage" class="hidden">

    <div class="searchBox">

      <input
        id="discoverSearch"
        placeholder="Search Vidora..."
      >

    </div>

    <div id="discoverResults"></div>

  </main>


  <!-- ================= BOTTOM NAV ================= -->

  <nav class="bottomNav">

    <button data-page="homePage" class="navButton active">
      <span>🏠</span>
      Home
    </button>

    <button data-page="discoverPage" class="navButton">
      <span>🔍</span>
      Discover
    </button>

    <button data-page="homePage" id="createNav" class="navButton createButton">
      <span>＋</span>
      Create
    </button>

    <button data-page="profilePage" class="navButton">
      <span>👤</span>
      Profile
    </button>

  </nav>

</section>


<script src="app.js"></script>

</body>
</html>

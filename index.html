<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="description" content="Vidora — Watch. Swipe. Connect." />
  <title>Vidora</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <section id="authScreen" class="auth-screen">
    <div class="auth-container">
      <div class="auth-logo"><span class="logo-text">Vidora</span><p class="tagline">Watch. Swipe. Connect.</p></div>
      <form id="loginForm" class="auth-form">
        <h2>Log in to Vidora</h2>
        <input id="loginEmail" class="field" type="email" placeholder="Email address" autocomplete="email" required />
        <input id="loginPassword" class="field" type="password" placeholder="Password" autocomplete="current-password" required />
        <button type="submit" class="btn primary full" id="loginBtn">Log In</button>
        <div class="auth-links"><button type="button" class="text-link" id="forgotPasswordBtn">Forgotten password?</button></div>
        <div class="divider"><span>or</span></div>
        <button type="button" class="btn secondary full" id="showSignupBtn">Create new account</button>
      </form>
      <form id="signupForm" class="auth-form hidden">
        <h2>Create a new account</h2><p class="muted small">It's quick and easy.</p>
        <div class="name-row"><input id="signupFirstName" class="field half" type="text" placeholder="First name" autocomplete="given-name" required maxlength="40" /><input id="signupLastName" class="field half" type="text" placeholder="Surname" autocomplete="family-name" required maxlength="40" /></div>
        <input id="signupEmail" class="field" type="email" placeholder="Email address" autocomplete="email" required />
        <input id="signupPassword" class="field" type="password" placeholder="New password" autocomplete="new-password" minlength="6" required />
        <label class="field-label">Date of birth</label>
        <div class="birthday-row"><select id="signupDay" class="field select" required><option value="">Day</option></select><select id="signupMonth" class="field select" required><option value="">Month</option><option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option><option value="4">Apr</option><option value="5">May</option><option value="6">Jun</option><option value="7">Jul</option><option value="8">Aug</option><option value="9">Sep</option><option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option></select><select id="signupYear" class="field select" required><option value="">Year</option></select></div>
        <label class="field-label">Gender</label>
        <div class="gender-row"><label class="gender-option"><span>Female</span><input type="radio" name="gender" value="female" required /></label><label class="gender-option"><span>Male</span><input type="radio" name="gender" value="male" /></label><label class="gender-option"><span>Custom</span><input type="radio" name="gender" value="custom" /></label></div>
        <p class="terms muted small">By clicking Sign Up, you agree to our Terms, Privacy Policy and Cookies Policy.</p>
        <button type="submit" class="btn signup-green full" id="signupBtn">Sign Up</button>
        <div class="auth-links"><button type="button" class="text-link" id="showLoginBtn">Already have an account?</button></div>
      </form>
      <div id="authStatus" class="status" role="status"></div>
    </div>
  </section>
  <div id="app" class="app hidden">
    <header id="topbar" class="topbar hidden"><div class="logo-small">Vidora</div><div class="top-actions"><button id="openNotificationsBtn" class="icon-btn" aria-label="Notifications">🔔</button><button id="openAvatarBtn" class="icon-btn" aria-label="Avatar">👤</button></div></header>
    <main id="main" class="main-content"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-view="home" class="nav-btn active"><span class="nav-icon">🏠</span><small>Home</small></button>
      <button data-view="discover" class="nav-btn"><span class="nav-icon">🔍</span><small>Discover</small></button>
      <button data-view="create" class="nav-btn create-btn"><span class="nav-icon">＋</span></button>
      <button data-view="inbox" class="nav-btn"><span class="nav-icon">💬</span><small>Inbox</small><span id="inboxBadge" class="badge hidden">0</span></button>
      <button data-view="profile" class="nav-btn"><span class="nav-icon">👤</span><small>Profile</small></button>
    </nav>
  </div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div id="sheet" class="sheet"></div></div>
  <button id="assistantFab" class="assistant-fab hidden" aria-label="Open Vidora AI">✨</button>
  <section id="assistantBox" class="assistant-box hidden">
    <div class="assistant-header"><div><strong>Vidora AI</strong><div class="muted small">Your assistant</div></div><button id="closeAssistant" class="icon-btn">×</button></div>
    <div id="assistantMessages" class="assistant-messages"></div>
    <div class="assistant-quick"><button class="quick-btn" data-action="toggle-theme">🌓 Theme</button><button class="quick-btn" data-action="messages">📩 Messages</button><button class="quick-btn" data-action="signout">🚪 Sign out</button></div>
    <form id="assistantForm" class="assistant-input"><input id="assistantInput" class="field" type="text" placeholder="Ask Vidora AI..." maxlength="500" autocomplete="off" /><button type="submit" class="btn primary">Send</button></form>
  </section>
  <script src="app.js"></script>
</body>
</html>
